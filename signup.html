<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | ASTRONARY</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="login-wrapper">
      <form class="login-card" action="#" method="POST">
        <h1>Join ASTRONARY</h1>
        <p>Create your account to explore the universe.</p>

        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <input type="password" placeholder="Confirm Password" required />

        <button type="submit" class="btn primary login-btn">Sign Up</button>

        <span class="login-footer">
          Already have an account?
          <a href="login.html">Log In</a><br />
          <br /><a href="index.html"><- Home</a>
        </span>
      </form>
    </div>
  </body>
</html>
