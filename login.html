<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | ASTRONARY</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="login-wrapper">
      <form class="login-card" action="#" method="POST">
        <h1>Welcome Back</h1>
        <p>Log in to continue exploring the universe.</p>

        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />

        <a href="profile.html" class="btn primary login-btn">Log In</a>

        <span class="login-footer">
          Don’t have an account?
          <a href="signup.html">Sign Up</a><br />
          <br /><a href="index.html"> <- Home</a>
        </span>
      </form>
    </div>
  </body>
</html>
