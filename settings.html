<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRONARY | Settings</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <header class="navbar">
      <div class="logo">ASTRONARY</div>

      <nav class="nav-links">
        <a href="profile.html">Profile</a>
        <a href="login.html">Logout</a>
      </nav>
    </header>

    <section class="profile-wrapper">
      <div class="profile-card">
        <h1 class="profile-name">Settings</h1>
        <p class="profile-email">Manage your account preferences</p>

        <div class="profile-info">
          <h3>Account Information</h3>

          <label class="settings-label">Email</label>
          <input
            class="settings-input"
            type="email"
            placeholder="Change email"
          />

          <label class="settings-label">Address</label>
          <input
            class="settings-input"
            type="text"
            placeholder="Change address"
          />

          <label class="settings-label">Password</label>
          <input
            class="settings-input"
            type="password"
            placeholder="Change password"
          />
        </div>

        <div class="profile-info">
          <h3>Appearance</h3>

          <label class="settings-checkbox">
            <input type="checkbox" />
            Enable Blue Space Theme
          </label>
        </div>

        <a href="#" class="btn primary profile-settings-btn"> Save Changes </a>

        <a
          href="profile.html"
          class="btn"
          style="margin-top: 16px; display: block"
        >
          ← Back to Profile
        </a>
      </div>
    </section>

    <footer>
      <p>
        © 2026 ASTRONARY • Astronomy for Learners & Researchers | Aleann Venice
        A. Achacoso
      </p>
    </footer>
  </body>
</html>
