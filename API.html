<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRONARY | Astronomy API Dictionary</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <header class="navbar">
      <div class="logo">ASTRONARY</div>

      <nav class="nav-links">
        <a href="index.html">Dictionary</a>
        <a href="#">Media</a>
        <a href="#">Research</a>
        <a href="API.html">API</a>
        <a href="#">About</a>
        <a href="saved.html">Saved Items</a>
      </nav>

      <div class="auth-buttons">
        <a href="login.html" class="btn ghost">Log In</a>
        <a href="signup.html" class="btn primary">Sign Up</a>
      </div>
    </header>

    <section class="api-container">
      <h1>Astronomy Visual Dictionary</h1>
      <p>Search for planets, stars, galaxies, and cosmic phenomena.</p>

      <div class="api-search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search astronomical term (e.g. Black Hole, Mars, Nebula)"
        />
        <button class="btn primary" onclick="searchNASA()">Search</button>
      </div>

      <div id="errorMessage" class="api-error"></div>

      <div id="results" class="api-results"></div>
    </section>

    <script>
      async function fetchWikipedia(term) {
        try {
          const res = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`,
          );

          if (!res.ok) return null;

          const data = await res.json();

          if (!data.thumbnail || !data.thumbnail.source) return null;

          return {
            title: data.title,
            description: data.extract,
            image: data.thumbnail.source,
          };
        } catch {
          return null;
        }
      }

      function saveItem(btn) {
        const item = {
          title: btn.dataset.title,
          description: btn.dataset.description,
          image: btn.dataset.image,
          source: btn.dataset.source,
        };

        let saved = JSON.parse(localStorage.getItem("savedSpaceData")) || [];

        const exists = saved.some((i) => i.title === item.title);

        if (exists) {
          alert("Item already saved!");
          return;
        }

        saved.push(item);
        localStorage.setItem("savedSpaceData", JSON.stringify(saved));

        // ✅ Update button UI
        btn.textContent = "Saved";
        btn.classList.add("saved");

        alert("Saved successfully!");
      }

      async function searchNASA() {
        const query = document.getElementById("searchInput").value.trim();
        const resultsDiv = document.getElementById("results");
        const errorDiv = document.getElementById("errorMessage");

        resultsDiv.innerHTML = "";
        errorDiv.textContent = "";

        if (!query) {
          errorDiv.textContent = "Please enter a search term.";
          return;
        }

        try {
          const [wikiData, nasaRes] = await Promise.all([
            fetchWikipedia(query),
            fetch(
              `https://images-api.nasa.gov/search?q=${query}&media_type=image`,
            ),
          ]);

          const nasaData = await nasaRes.json();

          const nasaItems = nasaData.collection.items.filter((item) => {
            return item.links && item.links[0] && item.links[0].href;
          });

          if (!wikiData && nasaItems.length === 0) {
            errorDiv.textContent = "No image results found.";
            return;
          }

          if (wikiData) {
            const card = document.createElement("div");
            card.className = "api-card";

            card.innerHTML = `
          <img src="${wikiData.image}">
          <span class="meta">Wikipedia</span>
          <h3>${wikiData.title}</h3>
          <p>${wikiData.description.substring(0, 140)}...</p>
          <button 
            data-title="${wikiData.title}"
            data-description="${wikiData.description}"
            data-image="${wikiData.image}"
            data-source="Wikipedia"
            onclick="saveItem(this)">
            Save
          </button>
        `;

            resultsDiv.appendChild(card);
          }

          nasaItems.slice(0, 6).forEach((item) => {
            const title = item.data[0].title || "NASA Image";
            const description = item.data[0].description || "";
            const image = item.links[0].href;

            const card = document.createElement("div");
            card.className = "api-card";

            function sanitizeDescription(text) {
              const noUrls = text.replace(/https?:\/\/[^\s]+/g, "");
              const cleanText = noUrls.replace(/<\/?[^>]+(>|$)/g, "");
              return cleanText.trim();
            }

            const cleanDescription = sanitizeDescription(description);
            card.innerHTML = `
  <img src="${image}">
  <span class="meta">NASA</span>
  <h3>${title}</h3>
  <p>${cleanDescription.substring(0, 140)}...</p>
  <button
    data-title="${title}"
    data-description="${cleanDescription}"
    data-image="${image}"
    data-source="NASA"
    onclick="saveItem(this)">
    Save
  </button>
`;

            resultsDiv.appendChild(card);
          });
        } catch (error) {
          errorDiv.textContent = "Failed to load data. Please try again.";
          console.error(error);
        }
      }

      document
        .getElementById("searchInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            searchNASA();
          }
        });
    </script>
  </body>
</html>
